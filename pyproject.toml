[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfire-sim"
version = "0.1.0"
description = "Автосъём curl GetAvailableJobs с iOS Simulator для Wayfair Service Pro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mitmproxy>=11.0.0,<12",
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
wayfire-sim = "wayfire_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
